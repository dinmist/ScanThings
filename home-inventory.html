<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Inventory</title>
<!-- Self-contained: data stays in this browser (IndexedDB). Object detection runs on-device with TensorFlow.js (COCO-SSD),
     downloaded once from the CDN and cached by the browser. No accounts, no server, no Claude. -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<style>
  :root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6f6e68;--line:#e4e2dc;--acc:#2f6f5e;--acc2:#e9f2ee;--warn:#b4432f;--r:14px}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{padding-bottom:90px}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 10px;font-size:20px;display:flex;align-items:center;justify-content:space-between}
  h1 small{font-size:12px;font-weight:500;color:var(--mute)}
  .search input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:999px;font-size:16px;background:var(--card);outline:none}
  .search input:focus{border-color:var(--acc)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--mute);cursor:pointer}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
  main{padding:12px 16px}
  .tabs{display:flex;background:#eceae4;border-radius:999px;padding:3px;margin-bottom:10px}
  .tabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:999px;font-size:14px;font-weight:600;color:var(--mute);cursor:pointer}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .empty{text-align:center;color:var(--mute);padding:60px 20px;font-size:15px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
  .card .ph{aspect-ratio:1;background:#eceae4 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#b8b5ab;font-size:34px;cursor:zoom-in}
  .card .b{padding:9px 11px 11px;cursor:pointer}
  .card .n{font-weight:600;font-size:15px;line-height:1.25}
  .card .w{font-size:12px;color:var(--mute);margin-top:3px;cursor:pointer}
  .locs{display:flex;flex-direction:column;gap:8px}
  .locgroup{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin:14px 2px 2px}
  .loc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
  .loc .t{flex:1}.loc .t b{display:block;font-size:15px}.loc .t span{font-size:12px;color:var(--mute)}
  .loc .c{background:var(--acc2);color:var(--acc);font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px}
